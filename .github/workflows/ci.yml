# =============================================================================
# CI: the tests of the logic and the data layer on every commit of a pull request.
#
# The same libraries as the app's image (Dockerfile): PyTorch CPU first, then requirements.txt, plus the
# test and tool libraries (requirements-dev.txt). No warehouse and no saved copy of the data here: the tests
# that need the copy (tools/sample, outside git) are skipped, the rest build their tables in DuckDB.
#
# One of the tests (test_the_index_matches_the_documents) fails when a knowledge document or the gold data
# dictionary changed and the index (data/rag_index) was not built again. Then start the workflow
# "build-index" on the same branch: it builds the index, commits it and starts this workflow again.
# =============================================================================
name: ci

on:
  pull_request:
  workflow_dispatch:

# A newer commit in the same pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Not on release-please's own pull request: it changes only VERSION and the CHANGELOG, and every commit it collects
    # was tested in its own pull request. (A pull_request trigger cannot filter by the head branch.)
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMOGCAST_DATA: sample   # never look for a warehouse (docker-compose.yml sets the same for the tests)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install the libraries
        run: |
          # The CPU build, the version of the Dockerfile: the default wheel pulls about 2 GB of CUDA libraries.
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      # The embedding model (about 0.5 GB), downloaded once per model name instead of on every run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('smogcast/app/conf/app.yaml') }}

      - name: Tests
        run: python -m pytest -q
